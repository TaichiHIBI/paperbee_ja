# -----------------------------------------------------------------------------
# Google Sheets設定 (オプション。非推奨：別途 google cloud 連携が必要)
# -----------------------------------------------------------------------------
# Google Sheetsで既読管理をする場合のみ設定してください。
# 使わない場合は空文字 "" に設定可能です。
GOOGLE_SPREADSHEET_ID: "your-google-spreadsheet-id"
GOOGLE_CREDENTIALS_JSON: "/path/to/your/google-credentials.json"

# -----------------------------------------------------------------------------
# ローカル履歴設定 (オプション。こちらを推奨)
# -----------------------------------------------------------------------------
# Google Sheetsの代わりにローカルのCSVファイルで既読管理を行います。
# ファイルは LOCAL_ROOT_DIR 直下に保存されます。
HISTORY_FILE: "history.csv"

NCBI_API_KEY: "your-ncbi-api-key"

# filesディレクトリへのパス（config.ymlやhistory.csvの保管場所）
LOCAL_ROOT_DIR: "../paperbee_ja/files"

# 検索クエリ設定
# ─────────────────────────────────────────────
# 【著者名検索】PubMed（[Author]）・arXiv（au:）・bioRxiv（API の著者欄）で著者を直接検索します。
# カンマ区切りで著者名を列記してください（"名 姓" の形式。ミドルネームの頭文字は省略可）。
query_authors: "Jane Doe, John Smith"

# 同姓同名の多い著者名の扱い（著者検索）
# "auto": PubMed で過去1年の論文数が AUTHOR_COMMON_NAME_THRESHOLD を超える名前（"Wang B" など）は別人の論文が
#         大量に掛かるため、その名前にしか一致しない論文は、著者リストの末尾 AUTHOR_SENIOR_POSITIONS 人
#         （責任著者側）にいる場合だけ候補にする。論文数は LOCAL_ROOT_DIR/author_pubmed_counts.json に保存し、30日ごとに取り直す
# 名前のリストで直接指定することも（例: ["Bo Wang", "Jian Ma"]）、"off" で無効にすることもできる
AUTHOR_COMMON_NAMES: "auto"
AUTHOR_SENIOR_POSITIONS: 2
AUTHOR_COMMON_NAME_THRESHOLD: 300

# 【bioRxiv 検索クエリ】タイトル・アブストラクトのキーワード検索です。
# 著者名を書いても著者としては一致しません（著者検索は query_authors を使ってください）。
# query_pubmed_arxiv と同じく AND / OR / AND NOT と括弧が使えます。[ ] 内はフレーズとして一致します
# （ハイフンは空白扱い、最後の語の複数形も一致。"[machine learning omics]" はこの語順のままでないと一致しない）。
query_biorxiv: "[machine learning for single-cell] OR [deep learning for single-cell] OR [AI for single-cell]"

# 【PubMed/arXiv キーワード検索クエリ】AND, OR, NOT が使用可能。
# query_authors と併用すると、著者検索＋キーワード検索の両方が実行されます。
# 著者検索のみで十分な場合は空文字 "" にしても構いません（その場合は省略可）。
query_pubmed_arxiv: "([single-cell transcriptomics]) AND ([AI] OR [machine learning] OR [deep learning])"

# -----------------------------------------------------------------------------
# Unedited version フィルタリング (オプション)
# -----------------------------------------------------------------------------
# CrossRef API の references-count が 0 の論文を除外します。
# 編集前の early access 版（unedited manuscript）に相当する論文を除去するために使用します。
FILTER_UNEDITED: false

# -----------------------------------------------------------------------------
# LLMフィルタリング設定 (オプション)
# -----------------------------------------------------------------------------
# タイトル・誌名・著者・キーワード・アブストラクトを読んで、FILTERING_PROMPT の基準で選別します。
# 判定は {HISTORY_FILE の名前}_decisions.csv に理由つきで記録され、同じ基準で不採用になった論文は再判定しません。
LLM_FILTERING: false
LLM_PROVIDER: "claude"            # "claude", "ollama", "openai", "gemini" のいずれか
LANGUAGE_MODEL: "claude-opus-5-5" # フィルタリングに使用するモデル（ollama なら例: gemma4:26b）
LLM_API_KEY: ""                   # OpenAIまたはGemini使用時のAPIキー（Claude は下の ANTHROPIC_API_KEY）

# -----------------------------------------------------------------------------
# Claude API 設定 (LLM_PROVIDER / SUMMARIZATION_PROVIDER / TRANSLATION_PROVIDER が "claude" のとき)
# -----------------------------------------------------------------------------
# 空なら環境変数 ANTHROPIC_API_KEY を使います（cron では環境変数が読まれないことが多いので注意）。
ANTHROPIC_API_KEY: ""
# 思考の深さ。"low" で十分なことが多い（"medium", "high" で精度と費用が上がる）
CLAUDE_EFFORT: "low"
# フィルタリングで1リクエストにまとめる論文数
CLAUDE_BATCH_SIZE: 20
# 月間予算（USD）。LOCAL_ROOT_DIR/claude_usage.csv に記録した推定支出が全トピック合算でこれに達すると、
# その月は Claude を呼ばずにローカルLLMで処理します。0 で上限なし。
# 参考単価 (USD / 100万トークン, 入力/出力): claude-opus-5-5 4/20, claude-sonnet-5-5 2/10, claude-haiku-5-5 0.10/0.50
CLAUDE_MONTHLY_BUDGET_USD: 100

# -----------------------------------------------------------------------------
# ローカルLLMのサブエージェント (Claude と併用する場合)
# -----------------------------------------------------------------------------
# Claude が使えないとき（予算超過・障害・拒否）に、このモデルがフィルタリングの判定を代行します。
# 未設定だと、その日に判定できなかった論文は投稿されません（--since の範囲内なら翌日に再判定）。
LOCAL_LLM_PROVIDER: "ollama"      # 現在は "ollama" のみ
LOCAL_LLM_MODEL: "gemma4:26b"
# true にすると、Claude の前にこのモデルで一次ふるいをかけ、明らかに無関係な論文だけを落とします。
# 候補が多いトピック（数十件/日以上）で Claude の費用を抑えたいときに使います。
LOCAL_PREFILTER: false

# フィルタリング用プロンプト
FILTERING_PROMPT: |
  You are a researcher in a computational biology lab. Your goal is to identify papers that propose **novel algorithms**.
  Criteria for Relevance (YES):
  - Proposes a new algorithm or method.
  - Applicable to human data.
  Criteria for Exclusion (NO):
  - Purely clinical studies.
  - Review papers.
  Please answer 'yes' or 'no' to the following question: Is the following research paper relevant?

# -----------------------------------------------------------------------------
# 要約設定 (オプション。Step 1: 英語アブストラクトの要約)
# -----------------------------------------------------------------------------
# 【推奨】Claude で日本語の要約を1回で作る場合:
#   SUMMARIZATION_PROVIDER: "claude", SUMMARIZATION_MODEL: "claude-opus-5-5",
#   下のプロンプトのまま TRANSLATION_ENABLED: false にする（ローカルの要約・翻訳モデルの読み込みが不要になる）
SUMMARIZATION_ENABLED: false
SUMMARIZATION_PROVIDER: "ollama" # "claude", "ollama", "openai", "gemini" のいずれか
SUMMARIZATION_MODEL: ""          # (例: claude-opus-5-5, gpt-oss:20b, gpt-4o-mini, gemini-2.5-flash)
SUMMARIZATION_API_KEY: ""        # OpenAIまたはGemini使用時のAPIキー

# 要約用プロンプト
SUMMARIZATION_PROMPT: |
  以下の論文アブストラクトを、専門家向けに重要なポイント3点の日本語の箇条書きで要約してください。
  出力は要約のみとしてください。

  {text}

# -----------------------------------------------------------------------------
# 日本語翻訳設定 (オプション。PLaMo-2などによる翻訳)
# -----------------------------------------------------------------------------
TRANSLATION_ENABLED: false
TRANSLATION_PROVIDER: "ollama" # "claude", "ollama", "openai", "gemini" のいずれか
TRANSLATION_MODEL: ""          # 使用するモデル名 (例: mitmul/plamo-2-translate, gpt-4o-mini, gemini-2.5-flash)
TRANSLATION_API_KEY: ""        # OpenAIまたはGemini使用時のAPIキー

# 翻訳用プロンプト (翻訳特化モデルの場合は空欄。汎用モデルの場合は以下を参考にしてください)
TRANSLATION_PROMPT: |
  Translate the following scientific abstract into Japanese. Output ONLY the translation.



# -----------------------------------------------------------------------------
# Slack設定 (日本語要約対応)
# -----------------------------------------------------------------------------
SLACK:
  is_posting_on: true
  bot_token: "your_slack_bot_token"
  channel_id: "your_slack_channel_id"
  app_token: "your_slack_app_token"

# その他のプラットフォーム設定...(使用非推奨。is_posting_on: false)
TELEGRAM:
  is_posting_on: false
  bot_token: "your-telegram-bot-token"
  channel_id: "your-telegram-channel-id"

ZULIP:
  is_posting_on: false
  prc: "path-to-your-zulip-prc"
  stream: "your-zulip-stream"
  topic: "your-zulip-topic"

MATTERMOST:
  is_posting_on: false
  url: "your-mattermost-url"
  token: "your-mattermost-access-token"
  team: "your-mattermost-team-name"
  channel: "your-mattermost-channel-name"